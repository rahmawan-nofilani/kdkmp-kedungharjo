name: Loan Partial Repayment UAT

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  loan-partial-repayment-uat:
    if: >-
      github.event.issue.number == 42 &&
      github.event.comment.body == 'UAT-KDKMP-LOAN-REPAYMENT-PARTIAL' &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    env:
      UAT_BASE_URL: https://kdkmp-kedungharjo.kdkmp-kedungharjo.workers.dev
      UAT_ADMINUNIT_EMAIL: uat.adminunit@example.com
      UAT_ADMINUNIT_PASSWORD: ${{ secrets.UAT_ADMINUNIT_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      CONTRACT_NUMBER: KON-20260819-04F7F835
      PAYMENT_AMOUNT: '200000'

    steps:
      - name: Guard credential
        run: test -n "$UAT_ADMINUNIT_PASSWORD"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          python -m playwright install chromium

      - name: Execute partial repayment
        id: uat
        shell: bash
        run: |
          mkdir -p /tmp/kdkmp-loan-repayment
          python <<'PY'
          import os,re,traceback
          from playwright.sync_api import sync_playwright,expect

          BASE=os.environ['UAT_BASE_URL'].rstrip('/')
          CONTRACT=os.environ['CONTRACT_NUMBER']
          AMOUNT=os.environ['PAYMENT_AMOUNT']
          RUN_ID=os.environ['GITHUB_RUN_ID']
          reference=f'UAT-REPAY-{RUN_ID}'
          stage='login'; repayment_no=''; repayment_url=''; treasury_label=''

          def out(k,v):
              with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
                  f.write(f'{k}={str(v).replace(chr(10)," ")}\n')

          def choose_containing(select,needle):
              opts=select.locator('option')
              for i in range(opts.count()):
                  opt=opts.nth(i); text=(opt.inner_text() or '').strip(); value=opt.get_attribute('value') or ''
                  if value and needle in text:
                      select.select_option(value=value); return text
              raise RuntimeError(f'Option containing {needle} not found')

          with sync_playwright() as p:
              b=p.chromium.launch(headless=True); page=b.new_page(); page.set_default_timeout(15000)
              try:
                  page.goto(BASE+'/login',wait_until='networkidle')
                  page.get_by_label('Email',exact=True).fill(os.environ['UAT_ADMINUNIT_EMAIL'])
                  page.get_by_label('Kata sandi',exact=True).fill(os.environ['UAT_ADMINUNIT_PASSWORD'])
                  page.get_by_role('button',name='Masuk ke KDKMP').click()
                  page.wait_for_url(re.compile(r'.*/dashboard(?:\?.*)?$'),timeout=20000)

                  stage='create-draft'
                  page.goto(BASE+'/loans/repayments',wait_until='networkidle')
                  expect(page.get_by_role('heading',name='Penerimaan Angsuran')).to_be_visible()
                  page.get_by_text('+ Catat Pembayaran',exact=True).click()
                  form=page.locator('form').filter(has=page.get_by_role('button',name='Buat Draft Pembayaran')).first
                  expect(form).to_be_visible()
                  choose_containing(form.locator('select[name="contract_id"]'),CONTRACT)
                  form.locator('input[name="amount"]').fill(AMOUNT)
                  form.locator('select[name="channel"]').select_option('CASH')
                  treasury_label=choose_containing(form.locator('select[name="treasury_account_id"]'),'CASH ·')
                  form.locator('input[name="payment_reference"]').fill(reference)
                  form.locator('input[name="request_note"]').fill(f'UAT partial repayment {RUN_ID}')
                  form.get_by_role('button',name='Buat Draft Pembayaran').click()
                  page.wait_for_url(re.compile(r'.*/loans/repayments/[^?]+\?status=created$'),timeout=20000)
                  repayment_url=page.url.split('?')[0]
                  repayment_no=page.locator('h1').inner_text().strip()
                  if not repayment_no: raise RuntimeError('Repayment number empty after create')
                  expect(page.get_by_text('DRAFT',exact=True).first).to_be_visible()

                  stage='post-payment'
                  page.get_by_role('button',name='Post Pembayaran').click()
                  page.wait_for_url(re.compile(r'.*/loans/repayments/[^?]+\?status=posted$'),timeout=30000)
                  expect(page.get_by_text('POSTED',exact=True).first).to_be_visible(timeout=20000)
                  expect(page.get_by_text(CONTRACT,exact=False).first).to_be_visible()
                  page.screenshot(path='/tmp/kdkmp-loan-repayment/pass.png',full_page=True)
                  out('failure_stage','');out('repayment_number',repayment_no);out('repayment_url',repayment_url);out('treasury_label',treasury_label);out('reference',reference)
                  print('Loan partial repayment PASS')
              except Exception:
                  out('failure_stage',stage);out('repayment_number',repayment_no);out('repayment_url',repayment_url);out('treasury_label',treasury_label);out('reference',reference)
                  try: page.screenshot(path='/tmp/kdkmp-loan-repayment/failure.png',full_page=True)
                  except Exception: pass
                  traceback.print_exc();raise
              finally:b.close()
          PY

      - name: Record PASS
        if: success()
        env:
          REPAYMENT: ${{ steps.uat.outputs.repayment_number }}
          TREASURY: ${{ steps.uat.outputs.treasury_label }}
          REFERENCE: ${{ steps.uat.outputs.reference }}
        run: |
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body "Loan partial repayment UAT PASS. Run \`$GITHUB_RUN_ID\`. Contract \`KON-20260819-04F7F835\`, repayment \`$REPAYMENT\`, amount Rp200.000, channel CASH, treasury \`$TREASURY\`, reference \`$REFERENCE\`, final status POSTED. Next: verify allocation/journal from fresh D1 and run controlled repayment reversal with distinct checker."

      - name: Record failure
        if: failure()
        env:
          STAGE: ${{ steps.uat.outputs.failure_stage }}
          REPAYMENT: ${{ steps.uat.outputs.repayment_number }}
          URL: ${{ steps.uat.outputs.repayment_url }}
        run: |
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body "Loan partial repayment UAT did not PASS. Run \`$GITHUB_RUN_ID\`. Stage \`${STAGE:-setup}\`; repayment \`${REPAYMENT:-not-created}\`; URL \`${URL:-none}\`. Inspect current state before retry to avoid duplicate payment posting."

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loan-partial-repayment-${{ github.run_id }}
          path: /tmp/kdkmp-loan-repayment/*.png
          if-no-files-found: ignore
          retention-days: 14
