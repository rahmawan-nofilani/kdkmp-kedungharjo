name: Supabase Production Logical Backup

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  production-backup:
    if: >-
      github.event.issue.number == 42 &&
      github.event.comment.body == 'BACKUP-KDKMP-SUPABASE' &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: xhjdqmrehpnvvjktwltl
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Record backup source commit
        shell: bash
        run: echo "BACKUP_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report backup start
        shell: bash
        run: |
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body "Supabase logical backup START for source commit \`$BACKUP_SOURCE_SHA\`. Scope: application \`public\` schema + data; Supabase-managed auth/storage schemas are intentionally excluded. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Validate Supabase database URL
        shell: bash
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "Missing SUPABASE_DB_URL in production Environment secrets" >&2; exit 1; }
          python3 <<'PY'
          import os
          from urllib.parse import urlparse

          value = os.environ["SUPABASE_DB_URL"]
          parsed = urlparse(value)
          if parsed.scheme not in {"postgres", "postgresql"}:
              raise SystemExit("SUPABASE_DB_URL must be a PostgreSQL connection URI")
          if not parsed.hostname:
              raise SystemExit("SUPABASE_DB_URL has no database hostname")
          if os.environ["SUPABASE_PROJECT_REF"] not in value:
              raise SystemExit("SUPABASE_DB_URL does not reference the locked production project")
          if not parsed.password:
              raise SystemExit("SUPABASE_DB_URL must include the database password")
          print("Supabase database URL shape validated for the locked production project")
          PY

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.101.0

      - name: Dump public schema and data
        shell: bash
        run: |
          mkdir -p backup
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          schema_file="backup/supabase-public-schema-${stamp}-${GITHUB_RUN_ID}.sql"
          data_file="backup/supabase-public-data-${stamp}-${GITHUB_RUN_ID}.sql"

          supabase db dump --db-url "$SUPABASE_DB_URL" --schema public --file "$schema_file"
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --schema public --use-copy --file "$data_file"

          test -s "$schema_file" || { echo "Schema dump is empty" >&2; exit 1; }
          test -s "$data_file" || { echo "Data dump is empty" >&2; exit 1; }
          grep -q "CREATE TABLE" "$schema_file" || { echo "Schema dump does not contain application tables" >&2; exit 1; }

          sha256sum "$schema_file" "$data_file" > backup/SHA256SUMS
          bundle_checksum="$(cat "$schema_file" "$data_file" | sha256sum | cut -d' ' -f1)"
          schema_bytes="$(stat -c%s "$schema_file")"
          data_bytes="$(stat -c%s "$data_file")"

          cat > backup/manifest.txt <<EOF
          project_ref=$SUPABASE_PROJECT_REF
          source_commit=$BACKUP_SOURCE_SHA
          scope=public schema + public data
          managed_schemas_excluded=auth,storage,extensions and other Supabase-managed schemas per CLI behavior
          schema_bytes=$schema_bytes
          data_bytes=$data_bytes
          bundle_sha256=$bundle_checksum
          run_id=$GITHUB_RUN_ID
          EOF

          echo "SUPABASE_BACKUP_CHECKSUM=$bundle_checksum" >> "$GITHUB_ENV"
          echo "SUPABASE_SCHEMA_BYTES=$schema_bytes" >> "$GITHUB_ENV"
          echo "SUPABASE_DATA_BYTES=$data_bytes" >> "$GITHUB_ENV"

      - name: Upload Supabase backup artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: kdkmp-supabase-public-production-${{ github.run_id }}
          path: backup/
          if-no-files-found: error
          retention-days: 30

      - name: Setup Bun for recovery evidence
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Validate Cloudflare recovery secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          test -n "$CLOUDFLARE_D1_DATABASE_ID" || { echo "Missing CLOUDFLARE_D1_DATABASE_ID" >&2; exit 1; }

      - name: Resolve Cloudflare account and D1 database
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const databaseId = process.env.CLOUDFLARE_D1_DATABASE_ID;
          const headers = { Authorization: `Bearer ${token}` };

          async function request(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, { headers });
            let body = null;
            try { body = await response.json(); } catch {}
            return { response, body };
          }

          async function getD1(accountId) {
            const { response, body } = await request(`/accounts/${accountId}/d1/database/${databaseId}`);
            if (!response.ok || !body?.success || !body.result?.name) return null;
            return body.result;
          }

          (async () => {
            const accounts = [];
            let page = 1;
            while (true) {
              const { response, body } = await request(`/accounts?page=${page}&per_page=50`);
              if (!response.ok || !body?.success || !Array.isArray(body.result)) {
                throw new Error('Could not list Cloudflare accounts with the production token.');
              }
              accounts.push(...body.result);
              const totalPages = Math.max(1, Math.ceil((body.result_info?.total_count ?? accounts.length) / 50));
              if (page >= totalPages) break;
              page += 1;
            }

            const matches = [];
            for (const account of accounts) {
              const d1 = await getD1(account.id);
              if (d1) matches.push({ accountId: account.id, d1 });
            }
            if (matches.length !== 1) {
              throw new Error(`Expected exactly one accessible account to own the configured D1 database; found ${matches.length}.`);
            }

            const { accountId, d1 } = matches[0];
            fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ACCOUNT_ID=${accountId}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_D1_DATABASE_NAME=${d1.name}\n`);
            console.log(`Resolved D1 database: ${d1.name}`);
          })().catch((error) => {
            console.error(error.message || error);
            process.exit(1);
          });
          NODE

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Resolve recovery organization
        shell: bash
        run: |
          bunx wrangler d1 execute "$CLOUDFLARE_D1_DATABASE_NAME" --remote --command "SELECT organization_id FROM (SELECT organization_id FROM transaction_audit_events WHERE organization_id IS NOT NULL UNION SELECT organization_id FROM products WHERE organization_id IS NOT NULL UNION SELECT organization_id FROM warehouses WHERE organization_id IS NOT NULL) AS orgs ORDER BY organization_id;" --json > /tmp/recovery-org.json
          python3 <<'PY'
          import json
          import os

          payload = json.load(open('/tmp/recovery-org.json', encoding='utf-8'))
          rows = []

          def collect(value):
              if isinstance(value, dict):
                  results = value.get('results')
                  if isinstance(results, list):
                      rows.extend(item for item in results if isinstance(item, dict))
                  for key, child in value.items():
                      if key != 'results':
                          collect(child)
              elif isinstance(value, list):
                  for child in value:
                      collect(child)

          collect(payload)
          organizations = sorted({str(row['organization_id']) for row in rows if row.get('organization_id')})
          if len(organizations) != 1:
              raise SystemExit(f'Expected exactly one production organization in D1; found {len(organizations)}')

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f"RECOVERY_ORGANIZATION_ID={organizations[0]}\n")
          print(f"Resolved single production organization: {organizations[0]}")
          PY

      - name: Generate Supabase recovery evidence SQL
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python3 <<'PY'
          import datetime
          import json
          import os
          import uuid
          from pathlib import Path

          now = datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z')
          artifact_url = os.environ['ARTIFACT_URL']
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          reference = f"github-actions-supabase-backup-{os.environ['GITHUB_RUN_ID']}"
          byte_size = int(os.environ['SUPABASE_SCHEMA_BYTES']) + int(os.environ['SUPABASE_DATA_BYTES'])
          payload = json.dumps(
              {
                  'provider': 'SUPABASE',
                  'reference': artifact_url,
                  'checksum': os.environ['SUPABASE_BACKUP_CHECKSUM'],
                  'byteSize': byte_size,
                  'scope': 'public schema + public data',
                  'managedSchemasExcluded': ['auth', 'storage'],
                  'note': f"Automated Supabase logical backup from {os.environ['BACKUP_SOURCE_SHA']} · {run_url}",
              },
              separators=(',', ':'),
          )

          def sql_string(value: str) -> str:
              return "'" + value.replace("'", "''") + "'"

          values = [
              str(uuid.uuid4()),
              os.environ['RECOVERY_ORGANIZATION_ID'],
              'SYSTEM_RECOVERY_WORKFLOW',
              'BACKUP_EXTERNAL_RECORDED',
              'SYSTEM_RECOVERY',
              reference,
              payload,
              now,
          ]
          statement = (
              'INSERT INTO transaction_audit_events '
              '(id,organization_id,actor_user_id,event_type,entity_type,entity_id,payload_json,created_at) VALUES ('
              + ','.join(map(sql_string, values))
              + ');\n'
          )
          Path('/tmp/supabase-recovery-evidence.sql').write_text(statement, encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f"SUPABASE_RECOVERY_REFERENCE={reference}\n")
          PY

      - name: Record verified Supabase backup evidence in production D1
        shell: bash
        run: |
          bunx wrangler d1 execute "$CLOUDFLARE_D1_DATABASE_NAME" --remote --file=/tmp/supabase-recovery-evidence.sql --yes

      - name: Verify Supabase backup evidence in production D1
        shell: bash
        run: |
          bunx wrangler d1 execute "$CLOUDFLARE_D1_DATABASE_NAME" --remote --command "SELECT COUNT(*) AS evidence_count FROM transaction_audit_events WHERE event_type='BACKUP_EXTERNAL_RECORDED' AND entity_id='$SUPABASE_RECOVERY_REFERENCE';" --json > /tmp/supabase-evidence-verify.json
          python3 <<'PY'
          import json

          payload = json.load(open('/tmp/supabase-evidence-verify.json', encoding='utf-8'))
          counts = []

          def collect(value):
              if isinstance(value, dict):
                  results = value.get('results')
                  if isinstance(results, list):
                      for row in results:
                          if isinstance(row, dict) and 'evidence_count' in row:
                              counts.append(int(row['evidence_count']))
                  for key, child in value.items():
                      if key != 'results':
                          collect(child)
              elif isinstance(value, list):
                  for child in value:
                      collect(child)

          collect(payload)
          if not counts or max(counts) != 1:
              raise SystemExit(f'Expected exactly one Supabase backup evidence row; observed {counts}')
          print('Supabase BACKUP_EXTERNAL_RECORDED evidence verified in production D1')
          PY

      - name: Report backup evidence
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body "Supabase logical backup PASS for project \`$SUPABASE_PROJECT_REF\` and source commit \`$BACKUP_SOURCE_SHA\`. Artifact: $ARTIFACT_URL · bundle SHA256: \`$SUPABASE_BACKUP_CHECKSUM\` · schema bytes: \`$SUPABASE_SCHEMA_BYTES\` · data bytes: \`$SUPABASE_DATA_BYTES\`. Scope is application public schema + data; Supabase-managed auth/storage schemas are excluded by design. Verified SUPABASE BACKUP evidence was also recorded automatically in production D1 for /readiness. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Backup summary
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "## KDKMP Supabase public logical backup"
            echo "- Project: \`$SUPABASE_PROJECT_REF\`"
            echo "- Source commit: \`$BACKUP_SOURCE_SHA\`"
            echo "- Artifact: $ARTIFACT_URL"
            echo "- Bundle SHA256: \`$SUPABASE_BACKUP_CHECKSUM\`"
            echo "- Public schema bytes: \`$SUPABASE_SCHEMA_BYTES\`"
            echo "- Public data bytes: \`$SUPABASE_DATA_BYTES\`"
            echo "- Scope: application public schema + data"
            echo "- Managed auth/storage schemas: excluded by Supabase CLI design"
            echo "- In-app Supabase backup evidence: recorded and verified"
            echo "- Artifact retention: 30 days"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report backup failure
        if: failure()
        shell: bash
        run: |
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body "Supabase logical backup / readiness evidence FAILED for project \`$SUPABASE_PROJECT_REF\` and source commit \`${BACKUP_SOURCE_SHA:-unknown}\`. A backup artifact may exist if failure occurred after upload, but no readiness PASS should be accepted until the failing step is corrected. Inspect: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
