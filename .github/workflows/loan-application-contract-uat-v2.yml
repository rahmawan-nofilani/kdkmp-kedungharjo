name: Loan Application Contract UAT V2

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  loan-application-contract-v2:
    if: >-
      github.event.issue.number == 42 &&
      github.event.comment.body == 'UAT-KDKMP-LOAN-APPLICATION-CONTRACT-V2' &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    env:
      UAT_BASE_URL: https://kdkmp-kedungharjo.kdkmp-kedungharjo.workers.dev
      UAT_ADMINUNIT_EMAIL: uat.adminunit@example.com
      UAT_ADMINUNIT_PASSWORD: ${{ secrets.UAT_ADMINUNIT_PASSWORD }}
      UAT_SUPERADMIN_EMAIL: uat.superadmin@example.com
      UAT_SUPERADMIN_PASSWORD: ${{ secrets.UAT_SUPERADMIN_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Guard credentials
        run: |
          test -n "$UAT_ADMINUNIT_PASSWORD"
          test -n "$UAT_SUPERADMIN_PASSWORD"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          python -m playwright install chromium

      - name: Run Loan batch 1 V2
        id: uat
        run: |
          mkdir -p /tmp/kdkmp-loan-uat-v2
          python <<'PY'
          import os,re,traceback
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from playwright.sync_api import sync_playwright,expect

          BASE=os.environ['UAT_BASE_URL'].rstrip('/')
          RUN_ID=os.environ['GITHUB_RUN_ID']
          stage='bootstrap'; app_no=''; app_url=''; contract_no=''; contract_url=''

          def out(k,v):
              with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:f.write(f'{k}={v}\n')
          def login(browser,email,password):
              c=browser.new_context(); page=c.new_page(); page.set_default_timeout(15000)
              page.goto(BASE+'/login',wait_until='networkidle')
              page.get_by_label('Email',exact=True).fill(email)
              page.get_by_label('Kata sandi',exact=True).fill(password)
              page.get_by_role('button',name='Masuk ke KDKMP').click()
              page.wait_for_url(re.compile(r'.*/dashboard(?:\?.*)?$'),timeout=20000)
              return c,page
          def nav(page,href):
              a=page.locator(f'a[href="{href}"]').first; expect(a).to_be_visible(timeout=15000); a.click()
              page.wait_for_url(re.compile(re.escape(BASE+href)+r'(?:\?.*)?$'),timeout=20000)
          def select_option_containing(select,needle):
              opts=select.locator('option')
              for i in range(opts.count()):
                  o=opts.nth(i); text=(o.inner_text() or '').strip(); value=o.get_attribute('value') or ''
                  if value and needle in text:
                      select.select_option(value=value); return text
              raise RuntimeError(f'Option containing {needle!r} not found')

          with sync_playwright() as p:
              b=p.chromium.launch(headless=True); active=None
              try:
                  stage='maker-nav'; mc,page=login(b,os.environ['UAT_ADMINUNIT_EMAIL'],os.environ['UAT_ADMINUNIT_PASSWORD']); active=page
                  nav(page,'/loans/applications')
                  expect(page.get_by_role('heading',name='Pengajuan Pinjaman')).to_be_visible()

                  stage='application-create'
                  page.get_by_text('+ Buat Pengajuan',exact=True).click()
                  form=page.locator('form').filter(has=page.get_by_role('button',name='Simpan Draft Pengajuan')).first
                  expect(form).to_be_visible()
                  form.locator('select[name="member_id"]').select_option(label='DEV-0002 · Anggota Demo Dua')
                  form.locator('select[name="product_version_id"]').select_option(label='F001 · Pinjaman Modal Usaha v1')
                  form.locator('input[name="requested_principal_amount"]').fill('1000000')
                  form.locator('input[name="requested_tenor_months"]').fill('6')
                  form.locator('textarea[name="purpose"]').fill(f'Modal usaha sintetis Loan UAT {RUN_ID}')
                  form.locator('input[name="declared_monthly_income_amount"]').fill('5000000')
                  form.locator('input[name="declared_monthly_obligation_amount"]').fill('0')
                  form.locator('textarea[name="guarantor_note"]').fill('DEV-0001 Anggota Demo Satu - penjamin sintetis UAT')
                  form.get_by_role('button',name='Simpan Draft Pengajuan').click()
                  page.wait_for_url(re.compile(r'.*/loans/applications/[^?]+\?status=created$'),timeout=20000)
                  app_url=page.url.split('?')[0]; app_no=page.locator('h1').inner_text().strip()
                  if not app_no: raise RuntimeError('Application number empty')

                  stage='eligibility'
                  page.get_by_role('button',name='Periksa Kelayakan').click()
                  page.wait_for_url(re.compile(r'.*/loans/applications/[^?]+\?status=checked$'),timeout=20000)
                  expect(page.get_by_text('LULUS',exact=True).first).to_be_visible(timeout=15000)
                  expect(page.get_by_role('button',name='Kirim ke Pemeriksa')).to_be_visible(timeout=15000)

                  stage='submit'
                  page.get_by_role('button',name='Kirim ke Pemeriksa').click()
                  page.wait_for_url(re.compile(r'.*/loans/applications/[^?]+\?status=submitted$'),timeout=20000)
                  mc.close()

                  stage='checker-review'
                  cc,page=login(b,os.environ['UAT_SUPERADMIN_EMAIL'],os.environ['UAT_SUPERADMIN_PASSWORD']); active=page
                  nav(page,'/loans/applications'); page.goto(app_url,wait_until='networkidle')
                  page.get_by_role('button',name='Mulai Pemeriksaan').click()
                  page.wait_for_url(re.compile(r'.*/loans/applications/[^?]+\?status=reviewing$'),timeout=20000)
                  stage='checker-approve'
                  page.get_by_role('button',name='Setujui Pengajuan').click()
                  page.wait_for_url(re.compile(r'.*/loans/applications/[^?]+\?status=approved$'),timeout=20000)
                  expect(page.get_by_text('DISETUJUI',exact=True)).to_be_visible(timeout=15000)
                  cc.close()

                  stage='contract-create'
                  mc,page=login(b,os.environ['UAT_ADMINUNIT_EMAIL'],os.environ['UAT_ADMINUNIT_PASSWORD']); active=page
                  nav(page,'/loans/contracts'); expect(page.get_by_role('heading',name='Kontrak & Jadwal Angsuran')).to_be_visible()
                  page.get_by_text('+ Bentuk Kontrak',exact=True).click()
                  cf=page.locator('form').filter(has=page.get_by_role('button',name='Bentuk Kontrak & Jadwal')).first; expect(cf).to_be_visible()
                  select_option_containing(cf.locator('select[name="application_id"]'),app_no)
                  cf.locator('input[name="agreement_date"]').fill(datetime.now(ZoneInfo('Asia/Jakarta')).date().isoformat())
                  cf.get_by_role('button',name='Bentuk Kontrak & Jadwal').click()
                  page.wait_for_url(re.compile(r'.*/loans/contracts/[^?]+\?status=created$'),timeout=20000)
                  contract_url=page.url.split('?')[0]; contract_no=page.locator('h1').inner_text().strip()
                  expect(page.get_by_text('SIAP DICAIRKAN',exact=True).first).to_be_visible(timeout=15000)
                  rows=page.locator('table tbody tr').count()
                  if rows != 6: raise RuntimeError(f'Expected exactly 6 schedule rows, got {rows}')
                  page.screenshot(path='/tmp/kdkmp-loan-uat-v2/pass.png',full_page=True); mc.close()
                  out('application_number',app_no);out('contract_number',contract_no);out('contract_url',contract_url);out('failure_stage','')
                  print('Loan batch 1 V2 PASS')
              except Exception:
                  out('failure_stage',stage);out('application_number',app_no);out('contract_number',contract_no)
                  if active:
                      try:active.screenshot(path='/tmp/kdkmp-loan-uat-v2/failure.png',full_page=True)
                      except Exception:pass
                  traceback.print_exc();raise
              finally:b.close()
          PY

      - name: Record PASS
        if: success()
        env:
          APP: ${{ steps.uat.outputs.application_number }}
          CONTRACT: ${{ steps.uat.outputs.contract_number }}
        run: |
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body "Loan UAT batch 1 V2 PASS. Run \`$GITHUB_RUN_ID\`. Application \`$APP\`: DEV-0002 / F001 / Rp1.000.000 / 6 bulan passed eligibility, was submitted by ADMIN_UNIT, reviewed and approved by different SUPER_ADMIN. Contract \`$CONTRACT\` created by ADMIN_UNIT with exactly 6 deterministic schedule rows and status READY/siap dicairkan. No Loan disbursement executed yet."

      - name: Record failure
        if: failure()
        env:
          STAGE: ${{ steps.uat.outputs.failure_stage }}
          APP: ${{ steps.uat.outputs.application_number }}
          CONTRACT: ${{ steps.uat.outputs.contract_number }}
        run: |
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body "Loan UAT batch 1 V2 did not PASS. Run \`$GITHUB_RUN_ID\`. Stage \`${STAGE:-setup}\`; application \`${APP:-not-created}\`; contract \`${CONTRACT:-not-created}\`. Inspect state before any retry to avoid duplicates."

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loan-application-contract-v2-${{ github.run_id }}
          path: /tmp/kdkmp-loan-uat-v2/*.png
          if-no-files-found: ignore
          retention-days: 14
