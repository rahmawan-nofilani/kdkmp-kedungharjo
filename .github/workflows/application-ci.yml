name: Application CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application-ci:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Next.js build
        run: bun run build

      - name: Cloudflare OpenNext build
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.d1_databases = [{
            binding: 'DB',
            database_name: 'ci-placeholder',
            database_id: '00000000-0000-0000-0000-000000000000'
          }];
          fs.writeFileSync('wrangler.ci.json', JSON.stringify(config, null, 2));
          NODE
          bunx opennextjs-cloudflare build --config=wrangler.ci.json --skipNextBuild

      - name: Wrangler production-shape dry run
        run: bunx wrangler deploy --dry-run --config=wrangler.ci.json

      - name: Remove generated CI config
        if: always()
        run: rm -f wrangler.ci.json
