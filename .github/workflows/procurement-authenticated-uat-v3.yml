name: Procurement Authenticated UAT V3

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  procurement-browser-uat-v3:
    if: >-
      github.event.issue.number == 42 &&
      github.event.comment.body == 'UAT-KDKMP-PROCUREMENT-V3' &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    env:
      UAT_BASE_URL: https://kdkmp-kedungharjo.kdkmp-kedungharjo.workers.dev
      UAT_ADMINUNIT_EMAIL: uat.adminunit@example.com
      UAT_ADMINUNIT_PASSWORD: ${{ secrets.UAT_ADMINUNIT_PASSWORD }}
      UAT_SUPERADMIN_EMAIL: uat.superadmin@example.com
      UAT_SUPERADMIN_PASSWORD: ${{ secrets.UAT_SUPERADMIN_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Guard synthetic UAT credentials
        shell: bash
        run: |
          test -n "$UAT_ADMINUNIT_PASSWORD"
          test -n "$UAT_SUPERADMIN_PASSWORD"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          python -m playwright install chromium

      - name: Run authenticated Procurement/AP golden flow
        id: uat
        shell: bash
        run: |
          mkdir -p /tmp/kdkmp-uat
          python <<'PY'
          import os
          import re
          import traceback
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from playwright.sync_api import sync_playwright, expect

          BASE = os.environ['UAT_BASE_URL'].rstrip('/')
          ADMIN_EMAIL = os.environ['UAT_ADMINUNIT_EMAIL']
          ADMIN_PASSWORD = os.environ['UAT_ADMINUNIT_PASSWORD']
          SUPER_EMAIL = os.environ['UAT_SUPERADMIN_EMAIL']
          SUPER_PASSWORD = os.environ['UAT_SUPERADMIN_PASSWORD']
          RUN_ID = os.environ['GITHUB_RUN_ID']
          suffix = RUN_ID[-8:]
          tag = f'UAT Procurement AP V3 {RUN_ID}'
          supplier_code = f'UATV3{suffix}'
          supplier_name = f'Supplier UAT V3 {suffix}'
          invoice_number = f'UATV3INV{suffix}'
          po_number = ''
          pr_number = ''
          po_url = ''
          stage = 'bootstrap'

          def output(name, value):
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
                  f.write(f'{name}={value}\n')

          def login(browser, email, password):
              context = browser.new_context()
              page = context.new_page()
              page.set_default_timeout(15000)
              page.goto(f'{BASE}/login', wait_until='networkidle')
              page.get_by_label('Email', exact=True).fill(email)
              page.get_by_label('Kata sandi', exact=True).fill(password)
              page.get_by_role('button', name='Masuk ke KDKMP').click()
              page.wait_for_url(re.compile(r'.*/dashboard(?:\?.*)?$'), timeout=20000)
              return context, page

          def open_procurement(page):
              link = page.get_by_role('link', name='Pembelian', exact=True)
              expect(link).to_be_visible(timeout=15000)
              link.click()
              page.wait_for_url(re.compile(r'.*/procurement(?:\?.*)?$'), timeout=20000)
              expect(page.get_by_role('heading', name='Supplier & Purchasing Control')).to_be_visible(timeout=15000)

          def open_ap(page):
              link = page.get_by_role('link', name='Hutang Pemasok', exact=True)
              expect(link).to_be_visible(timeout=15000)
              link.click()
              page.wait_for_url(re.compile(r'.*/procurement/ap(?:\?.*)?$'), timeout=20000)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              active_page = None
              try:
                  stage = 'maker-login-nav'
                  maker_ctx, page = login(browser, ADMIN_EMAIL, ADMIN_PASSWORD)
                  active_page = page
                  open_procurement(page)

                  stage = 'supplier-create'
                  supplier_form = page.locator('form').filter(has=page.get_by_role('button', name='Simpan Supplier')).first
                  expect(supplier_form).to_be_visible(timeout=15000)
                  supplier_form.locator('input[name="code"]').fill(supplier_code)
                  supplier_form.locator('input[name="name"]').fill(supplier_name)
                  supplier_form.get_by_role('button', name='Simpan Supplier').click()
                  page.wait_for_url(re.compile(r'.*/procurement\?status=supplier-created$'), timeout=20000)

                  stage = 'pr-create'
                  pr_form = page.locator('form').filter(has=page.get_by_role('button', name='Submit Purchase Request')).first
                  expect(pr_form).to_be_visible(timeout=15000)
                  pr_form.locator('select[name="preferredSupplierId"]').select_option(label=f'{supplier_code} · {supplier_name}')
                  selects = pr_form.locator('select')
                  if selects.count() < 2:
                      raise RuntimeError('PR product select was not found.')
                  selects.nth(1).select_option(index=1)
                  pr_form.locator('input[name="notes"]').fill(tag)
                  pr_form.locator('input[type="number"]').first.fill('1')
                  submit_pr = pr_form.get_by_role('button', name='Submit Purchase Request')
                  expect(submit_pr).to_be_enabled()
                  submit_pr.click()
                  page.wait_for_url(re.compile(r'.*/procurement\?status=pr-submitted$'), timeout=20000)

                  row = page.locator('table tbody tr').filter(has_text=tag).first
                  expect(row).to_be_visible(timeout=15000)
                  pr_number = row.locator('td').nth(0).locator('strong').inner_text().strip()
                  if not pr_number:
                      raise RuntimeError('Purchase Request number could not be captured.')
                  maker_ctx.close()

                  stage = 'checker-login-nav'
                  checker_ctx, page = login(browser, SUPER_EMAIL, SUPER_PASSWORD)
                  active_page = page
                  open_procurement(page)

                  stage = 'pr-approve'
                  approve_scope = page.locator('div').filter(has_text=pr_number).filter(has=page.get_by_role('button', name='Approve')).first
                  expect(approve_scope).to_be_visible(timeout=15000)
                  approve_scope.get_by_role('button', name='Approve').click()
                  page.wait_for_url(re.compile(r'.*/procurement\?status=pr-approved$'), timeout=20000)

                  stage = 'po-create'
                  po_form = page.locator('form').filter(has_text=pr_number).filter(has=page.get_by_role('button', name='Buat PO Draft')).first
                  expect(po_form).to_be_visible(timeout=15000)
                  po_form.get_by_role('button', name='Buat PO Draft').click()
                  page.wait_for_url(re.compile(r'.*/procurement/po/[^?]+\?status=created$'), timeout=20000)
                  po_url = page.url.split('?')[0]
                  po_number = page.locator('h1').inner_text().strip()
                  if not po_number:
                      raise RuntimeError('Purchase Order number could not be captured.')

                  stage = 'po-issue'
                  page.get_by_role('button', name='Issue Purchase Order').click()
                  page.wait_for_url(re.compile(r'.*/procurement/po/[^?]+\?status=issued$'), timeout=20000)
                  checker_ctx.close()

                  stage = 'maker-receiving-nav'
                  maker_ctx, page = login(browser, ADMIN_EMAIL, ADMIN_PASSWORD)
                  active_page = page
                  open_procurement(page)
                  page.goto(po_url, wait_until='networkidle')
                  page.wait_for_url(re.compile(r'.*/procurement/po/[^?]+$'), timeout=20000)

                  stage = 'receiving'
                  receiving_form = page.locator('form').filter(has=page.get_by_role('button', name='Posting Goods Receipt')).first
                  expect(receiving_form).to_be_visible(timeout=15000)
                  receiving_form.locator('select[name="warehouseId"]').select_option(index=1)
                  receiving_form.locator('input[name="notes"]').fill(tag)
                  receiving_form.locator('input[type="number"]').first.fill('1')
                  required_batch = receiving_form.locator('input[placeholder="Wajib"]')
                  if required_batch.count():
                      required_batch.first.fill(f'UATBATCH{suffix}')
                      receiving_form.locator('input[type="date"]').first.fill((datetime.now(ZoneInfo('Asia/Jakarta')).date() + timedelta(days=365)).isoformat())
                  post_receipt = receiving_form.get_by_role('button', name='Posting Goods Receipt')
                  expect(post_receipt).to_be_enabled()
                  post_receipt.click()
                  page.wait_for_url(re.compile(r'.*/procurement/po/[^?]+\?status=received$'), timeout=20000)
                  ap_link = page.get_by_role('link', name=re.compile('Buka Hutang Pemasok'))
                  expect(ap_link).to_be_visible(timeout=15000)
                  ap_link.click()
                  page.wait_for_url(re.compile(r'.*/procurement/ap$'), timeout=20000)

                  stage = 'invoice-create'
                  invoice_form = page.locator('form').filter(has=page.get_by_role('button', name='Simpan Invoice Draft')).first
                  expect(invoice_form).to_be_visible(timeout=15000)
                  invoice_form.locator('select[name="purchaseOrderId"]').select_option(label=f'{po_number} · {supplier_name}')
                  today = datetime.now(ZoneInfo('Asia/Jakarta')).date()
                  invoice_form.locator('input[name="invoiceNumber"]').fill(invoice_number)
                  invoice_form.locator('input[name="invoiceDate"]').fill(today.isoformat())
                  invoice_form.locator('input[name="dueDate"]').fill((today + timedelta(days=7)).isoformat())
                  invoice_form.get_by_role('button', name='Simpan Invoice Draft').click()
                  page.wait_for_url(re.compile(r'.*/procurement/ap\?status=invoice-created$'), timeout=20000)
                  maker_ctx.close()

                  stage = 'checker-ap-nav'
                  checker_ctx, page = login(browser, SUPER_EMAIL, SUPER_PASSWORD)
                  active_page = page
                  open_ap(page)

                  stage = 'three-way-match'
                  card = page.locator('article').filter(has_text=invoice_number).first
                  expect(card).to_be_visible(timeout=15000)
                  card.get_by_role('button', name='Run 3-Way Match').click()
                  page.wait_for_url(re.compile(r'.*/procurement/ap\?status=match-pass$'), timeout=20000)

                  stage = 'invoice-approve'
                  card = page.locator('article').filter(has_text=invoice_number).first
                  expect(card).to_contain_text('MATCH')
                  card.get_by_role('button', name='Approve Invoice').click()
                  page.wait_for_url(re.compile(r'.*/procurement/ap\?status=invoice-approved$'), timeout=20000)

                  stage = 'ap-payment'
                  card = page.locator('article').filter(has_text=invoice_number).first
                  expect(card).to_be_visible(timeout=15000)
                  card.locator('select[name="method"]').select_option('BANK_TRANSFER')
                  card.locator('input[name="referenceNumber"]').fill(f'UAT-{RUN_ID}')
                  card.get_by_role('button', name='Posting Payment').click()
                  page.wait_for_url(re.compile(r'.*/procurement/ap\?status=payment-posted$'), timeout=20000)

                  stage = 'post-payment-assertion'
                  card = page.locator('article').filter(has_text=invoice_number).first
                  expect(card).to_be_visible(timeout=15000)
                  card_text = card.inner_text().replace('\u00a0', ' ')
                  if 'Sisa' not in card_text or not re.search(r'Sisa\s+Rp\s*0\b', card_text):
                      raise RuntimeError(f'Invoice remaining amount is not zero after payment: {card_text}')
                  if card.get_by_role('button', name='Posting Payment').count() != 0:
                      raise RuntimeError('Payment action is still available after full payment.')

                  page.screenshot(path='/tmp/kdkmp-uat/procurement-ap-v3-pass.png', full_page=True)
                  checker_ctx.close()
                  output('tag', tag)
                  output('supplier_code', supplier_code)
                  output('pr_number', pr_number)
                  output('po_number', po_number)
                  output('invoice_number', invoice_number)
                  output('failure_stage', '')
                  print('Authenticated Procurement/AP V3 browser flow PASS.')
              except Exception:
                  output('failure_stage', stage)
                  if active_page is not None:
                      try:
                          active_page.screenshot(path='/tmp/kdkmp-uat/procurement-ap-v3-failure.png', full_page=True)
                      except Exception:
                          pass
                  traceback.print_exc()
                  raise
              finally:
                  browser.close()
          PY

      - name: Record PASS evidence
        if: success()
        shell: bash
        env:
          UAT_TAG: ${{ steps.uat.outputs.tag }}
          UAT_SUPPLIER: ${{ steps.uat.outputs.supplier_code }}
          UAT_PR: ${{ steps.uat.outputs.pr_number }}
          UAT_PO: ${{ steps.uat.outputs.po_number }}
          UAT_INVOICE: ${{ steps.uat.outputs.invoice_number }}
        run: |
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body "Authenticated Procurement/AP V3 browser automation PASS (synthetic data only). Run \`$GITHUB_RUN_ID\`. Tag: \`$UAT_TAG\`. Supplier: \`$UAT_SUPPLIER\`. PR: \`$UAT_PR\`. PO: \`$UAT_PO\`. Invoice: \`$UAT_INVOICE\`. Distinct ADMIN_UNIT maker and SUPER_ADMIN checker completed Supplier → PR → approval → PO → issue → receiving → invoice → 3-Way Match → approval → BANK_TRANSFER payment. Next: fresh D1 backup and inventory/AP/journal/audit verification before changing release status."

      - name: Record failure stage
        if: failure()
        shell: bash
        env:
          FAILURE_STAGE: ${{ steps.uat.outputs.failure_stage }}
        run: |
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body "Authenticated Procurement/AP V3 did not PASS. Run \`$GITHUB_RUN_ID\`. Failure stage: \`${FAILURE_STAGE:-setup-or-install}\`. Inspect screenshot/log before retry; do not mark Procurement/AP UAT PASS."

      - name: Upload UAT screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procurement-authenticated-uat-v3-${{ github.run_id }}
          path: /tmp/kdkmp-uat/*.png
          if-no-files-found: ignore
          retention-days: 14
