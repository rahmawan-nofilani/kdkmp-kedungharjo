name: Cloudflare Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY-KDKMP-PRODUCTION to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  production-deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY-KDKMP-PRODUCTION'
    runs-on: ubuntu-latest
    environment: production
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://xhjdqmrehpnvvjktwltl.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_PRODUCTION_URL: ${{ vars.CLOUDFLARE_PRODUCTION_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Validate production configuration
        shell: bash
        run: |
          required=(
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_D1_DATABASE_NAME
            CLOUDFLARE_D1_DATABASE_ID
            CLOUDFLARE_PRODUCTION_URL
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Missing required production setting: $name" >&2
              exit 1
            fi
          done
          if [ "$NEXT_PUBLIC_SUPABASE_URL" != "https://xhjdqmrehpnvvjktwltl.supabase.co" ]; then
            echo "Unexpected Supabase project URL." >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install

      - name: Generate production Wrangler config
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.d1_databases = [{
            binding: 'DB',
            database_name: process.env.CLOUDFLARE_D1_DATABASE_NAME,
            database_id: process.env.CLOUDFLARE_D1_DATABASE_ID
          }];
          fs.writeFileSync('wrangler.production.json', JSON.stringify(config, null, 2));
          NODE

      - name: Typecheck
        run: bun run typecheck

      - name: Next.js build
        run: bun run build

      - name: Cloudflare OpenNext build
        run: bunx opennextjs-cloudflare build --config=wrangler.production.json --skipNextBuild

      - name: Deploy exact main candidate
        run: bunx opennextjs-cloudflare deploy --config=wrangler.production.json

      - name: Public smoke test
        shell: bash
        run: |
          base="${CLOUDFLARE_PRODUCTION_URL%/}"
          curl --fail --show-error --silent --location --retry 3 --max-time 30 "$base/login" >/dev/null
          curl --fail --show-error --silent --location --retry 3 --max-time 30 "$base/manifest.webmanifest" >/dev/null

      - name: Remove generated production config
        if: always()
        run: rm -f wrangler.production.json
