name: Cloudflare Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY-KDKMP-PRODUCTION to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  production-deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY-KDKMP-PRODUCTION'
    runs-on: ubuntu-latest
    environment: production
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://xhjdqmrehpnvvjktwltl.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dzltH7ywA-wS6WxtiGwM6Q_3wsBzeCr
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      WORKER_NAME: kdkmp-kedungharjo
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Validate production secrets
        shell: bash
        run: |
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_D1_DATABASE_ID
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Missing required production secret: $name" >&2
              exit 1
            fi
          done
          if [ "$NEXT_PUBLIC_SUPABASE_URL" != "https://xhjdqmrehpnvvjktwltl.supabase.co" ]; then
            echo "Unexpected Supabase project URL." >&2
            exit 1
          fi

      - name: Resolve Cloudflare account, D1, and production URL
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const databaseId = process.env.CLOUDFLARE_D1_DATABASE_ID;
          const explicitAccountId = process.env.CLOUDFLARE_ACCOUNT_ID?.trim();
          const headers = { Authorization: `Bearer ${token}` };

          async function cloudflare(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, { headers });
            let body;
            try { body = await response.json(); } catch { body = null; }
            return { response, body };
          }

          async function getD1(accountId) {
            const { response, body } = await cloudflare(`/accounts/${accountId}/d1/database/${databaseId}`);
            if (!response.ok || !body?.success || !body.result?.name) return null;
            return body.result;
          }

          async function resolveAccountId() {
            if (explicitAccountId) {
              const d1 = await getD1(explicitAccountId);
              if (!d1) throw new Error('Optional CLOUDFLARE_ACCOUNT_ID does not own the supplied D1 database ID.');
              return { accountId: explicitAccountId, d1 };
            }

            const accounts = [];
            let page = 1;
            while (true) {
              const { response, body } = await cloudflare(`/accounts?page=${page}&per_page=50`);
              if (!response.ok || !body?.success || !Array.isArray(body.result)) {
                throw new Error('Could not list Cloudflare accounts with this API token. Add optional CLOUDFLARE_ACCOUNT_ID if the token cannot list accounts.');
              }
              accounts.push(...body.result);
              const totalPages = Math.max(1, Math.ceil((body.result_info?.total_count ?? accounts.length) / 50));
              if (page >= totalPages) break;
              page += 1;
            }

            const matches = [];
            for (const account of accounts) {
              const d1 = await getD1(account.id);
              if (d1) matches.push({ accountId: account.id, d1 });
            }
            if (matches.length !== 1) {
              throw new Error(`Expected exactly one accessible account to own the supplied D1 database ID; found ${matches.length}.`);
            }
            return matches[0];
          }

          (async () => {
            const { accountId, d1 } = await resolveAccountId();
            const { response, body } = await cloudflare(`/accounts/${accountId}/workers/subdomain`);
            if (!response.ok || !body?.success || !body.result?.subdomain) {
              throw new Error('Cloudflare Workers account subdomain could not be resolved.');
            }
            const productionUrl = `https://${process.env.WORKER_NAME}.${body.result.subdomain}.workers.dev`;
            fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ACCOUNT_ID=${accountId}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_D1_DATABASE_NAME=${d1.name}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_PRODUCTION_URL=${productionUrl}\n`);
            console.log(`Resolved Cloudflare account: ${accountId}`);
            console.log(`Resolved D1 database: ${d1.name}`);
            console.log(`Resolved production URL: ${productionUrl}`);
          })().catch((error) => {
            console.error(error.message || error);
            process.exit(1);
          });
          NODE

      - name: Install dependencies
        run: bun install

      - name: Generate production Wrangler config
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          if (config.name !== process.env.WORKER_NAME) {
            throw new Error(`Unexpected Worker name: ${config.name}`);
          }
          config.d1_databases = [{
            binding: 'DB',
            database_name: process.env.CLOUDFLARE_D1_DATABASE_NAME,
            database_id: process.env.CLOUDFLARE_D1_DATABASE_ID
          }];
          fs.writeFileSync('wrangler.production.json', JSON.stringify(config, null, 2));
          NODE

      - name: Typecheck
        run: bun run typecheck

      - name: Next.js build
        run: bun run build

      - name: Cloudflare OpenNext build
        run: bunx opennextjs-cloudflare build --config=wrangler.production.json --skipNextBuild

      - name: Wrangler production dry run
        run: bunx wrangler deploy --dry-run --config=wrangler.production.json

      - name: Deploy exact main candidate
        run: bunx opennextjs-cloudflare deploy --config=wrangler.production.json

      - name: Verify workers.dev exposure
        shell: bash
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/subdomain" \
            -o /tmp/worker-subdomain-status.json
          node - <<'NODE'
          const fs = require('fs');
          const value = JSON.parse(fs.readFileSync('/tmp/worker-subdomain-status.json', 'utf8'));
          if (!value.success || value.result?.enabled !== true) {
            console.error('The Worker is not enabled on the account workers.dev subdomain.');
            process.exit(1);
          }
          NODE

      - name: Public infrastructure smoke test
        shell: bash
        run: |
          base="${CLOUDFLARE_PRODUCTION_URL%/}"
          curl --fail --show-error --silent --location --retry 5 --retry-delay 3 --max-time 30 "$base/api/health" | tee /tmp/kdkmp-health.json
          curl --fail --show-error --silent --location --retry 3 --max-time 30 "$base/login" >/dev/null
          curl --fail --show-error --silent --location --retry 3 --max-time 30 "$base/manifest.webmanifest" >/dev/null
          node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync("/tmp/kdkmp-health.json","utf8")); if(v.status!=="ok"||v.checks?.d1!=="ok"||v.checks?.supabase!=="ok") process.exit(1)'

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "## KDKMP production deployment"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- URL: ${CLOUDFLARE_PRODUCTION_URL}"
            echo "- D1: ${CLOUDFLARE_D1_DATABASE_NAME}"
            echo "- OpenNext build: PASS"
            echo "- Wrangler dry run: PASS"
            echo "- workers.dev exposure: PASS"
            echo "- D1 + Supabase health: PASS"
            echo "- Public login + manifest smoke: PASS"
            echo ""
            echo "Authenticated synthetic-data UAT and backup/restore evidence are still required before real-data go-live."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove generated production files
        if: always()
        run: rm -f wrangler.production.json /tmp/kdkmp-health.json /tmp/worker-subdomain-status.json
