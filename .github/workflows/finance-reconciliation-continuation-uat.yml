name: Finance Reconciliation Continuation UAT

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  finance-reconciliation-continuation-uat:
    if: >-
      github.event.issue.number == 42 &&
      github.event.comment.body == 'UAT-KDKMP-FINANCE-RECON-CONTINUE' &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    env:
      UAT_BASE_URL: https://kdkmp-kedungharjo.kdkmp-kedungharjo.workers.dev
      UAT_SUPERADMIN_EMAIL: uat.superadmin@example.com
      UAT_SUPERADMIN_PASSWORD: ${{ secrets.UAT_SUPERADMIN_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      RECONCILIATION_NUMBER: REC-MSZS1YQV-7E78E

    steps:
      - name: Guard credential
        run: test -n "$UAT_SUPERADMIN_PASSWORD"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          python -m playwright install chromium

      - name: Continue existing reconciliation and verify closing blockers
        id: uat
        shell: bash
        run: |
          mkdir -p /tmp/kdkmp-finance-continuation
          python <<'PY'
          import os,re,traceback
          from playwright.sync_api import sync_playwright,expect

          BASE=os.environ['UAT_BASE_URL'].rstrip('/')
          RECON=os.environ['RECONCILIATION_NUMBER']
          stage='login'; matched_count=0; recon_url=''; starting_unmatched=-1

          def out(k,v):
              with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
                  f.write(f'{k}={str(v).replace(chr(10)," ")}\n')

          def body(page):
              return re.sub(r'\s+',' ',page.locator('body').inner_text().replace('\u00a0',' '))

          def unmatched(page):
              m=re.search(r'UNMATCHED\s*(\d+)\s*dari\s*4',body(page),re.I)
              if not m:
                  raise RuntimeError('Could not read unmatched counter')
              return int(m.group(1))

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(); page.set_default_timeout(15000)
              try:
                  page.goto(BASE+'/login',wait_until='networkidle')
                  page.get_by_label('Email',exact=True).fill(os.environ['UAT_SUPERADMIN_EMAIL'])
                  page.get_by_label('Kata sandi',exact=True).fill(os.environ['UAT_SUPERADMIN_PASSWORD'])
                  page.get_by_role('button',name='Masuk ke KDKMP').click()
                  page.wait_for_url(re.compile(r'.*/dashboard(?:\?.*)?$'),timeout=20000)

                  stage='open-existing-reconciliation'
                  page.goto(BASE+'/finance/treasury',wait_until='networkidle')
                  link=page.get_by_role('link').filter(has_text=RECON).first
                  expect(link).to_be_visible()
                  link.click()
                  page.wait_for_url(re.compile(r'.*/finance/treasury/reconciliation/[^?]+(?:\?.*)?$'),timeout=20000)
                  page.wait_for_load_state('networkidle')
                  recon_url=page.url.split('?')[0]
                  expect(page.get_by_role('heading',name=RECON)).to_be_visible()
                  expect(page.get_by_text('DRAFT',exact=True).first).to_be_visible()
                  text=body(page)
                  if not re.search(r'STATEMENT CLOSING\s*-Rp\s*15\.000',text,re.I): raise RuntimeError('Statement closing is not -Rp15.000')
                  if not re.search(r'SYSTEM CLOSING\s*-Rp\s*15\.000',text,re.I): raise RuntimeError('System closing is not -Rp15.000')
                  if not re.search(r'DIFFERENCE\s*Rp\s*0',text,re.I): raise RuntimeError('Difference is not Rp0')
                  starting_unmatched=unmatched(page)
                  if starting_unmatched < 0 or starting_unmatched > 4: raise RuntimeError(f'Unexpected unmatched count {starting_unmatched}')

                  stage='match-items'
                  while unmatched(page) > 0:
                      buttons=page.get_by_role('button',name='Match',exact=True)
                      if buttons.count()==0:
                          raise RuntimeError(f'No Match button while {unmatched(page)} item(s) remain unmatched')
                      before=unmatched(page)
                      buttons.first.click()
                      page.wait_for_url(re.compile(r'.*\?status=item-updated$'),timeout=20000)
                      page.wait_for_load_state('networkidle')
                      # Explicit clean reload prevents a transient Server Action DOM from hiding the next control.
                      page.goto(recon_url,wait_until='networkidle')
                      after=unmatched(page)
                      if after != before-1:
                          raise RuntimeError(f'Expected unmatched {before-1} after Match, got {after}')
                      matched_count+=1
                      if matched_count>4: raise RuntimeError('Matched more than four reconciliation items')

                  expect(page.get_by_text('Ready to reconcile',exact=True)).to_be_visible()
                  if unmatched(page)!=0: raise RuntimeError('Unmatched count is not zero')

                  stage='complete-reconciliation'
                  page.get_by_role('button',name='Complete Reconciliation').click()
                  page.wait_for_url(re.compile(r'.*\?status=reconciled$'),timeout=20000)
                  page.wait_for_load_state('networkidle')
                  expect(page.get_by_text('RECONCILED',exact=True).first).to_be_visible()
                  expect(page.get_by_text('Rekonsiliasi selesai',exact=True)).to_be_visible()
                  text=body(page)
                  if not re.search(r'DIFFERENCE\s*Rp\s*0',text,re.I): raise RuntimeError('Final difference is not Rp0')
                  if not re.search(r'UNMATCHED\s*0\s*dari\s*4',text,re.I): raise RuntimeError('Final unmatched is not 0/4')
                  page.screenshot(path='/tmp/kdkmp-finance-continuation/reconciliation-pass.png',full_page=True)

                  stage='closing-readiness'
                  page.goto(BASE+'/finance/closing-readiness?month=2026-08',wait_until='networkidle')
                  expect(page.get_by_role('heading',name='Kesiapan Tutup Buku')).to_be_visible()
                  expect(page.get_by_text('PERLU DICEK',exact=True)).to_be_visible()
                  text=body(page)
                  for label in ['Jurnal seimbang','Tidak ada jurnal yang masih menggantung','Pencocokan rekening bank selesai','Penyusutan aset bulan ini selesai','Tidak ada shift teller yang masih OPEN']:
                      if label not in text: raise RuntimeError(f'Closing-readiness label missing: {label}')
                  if '1/1 rekening sudah direkonsiliasi.' not in text: raise RuntimeError('Bank reconciliation readiness did not become 1/1')
                  if '1 jurnal belum selesai.' not in text: raise RuntimeError('Expected one unfinished controlled journal blocker')
                  if '1 aset masih menunggu penyusutan.' not in text: raise RuntimeError('Expected one depreciation blocker')
                  if '1 shift teller masih OPEN' not in text: raise RuntimeError('Expected one OPEN teller shift blocker')
                  page.screenshot(path='/tmp/kdkmp-finance-continuation/closing-readiness-pass.png',full_page=True)

                  out('failure_stage','');out('starting_unmatched',starting_unmatched);out('matched_count',matched_count);out('reconciliation_url',recon_url)
                  print('Finance existing reconciliation continuation PASS')
              except Exception:
                  out('failure_stage',stage);out('starting_unmatched',starting_unmatched);out('matched_count',matched_count);out('reconciliation_url',recon_url)
                  try: page.screenshot(path='/tmp/kdkmp-finance-continuation/failure.png',full_page=True)
                  except Exception: pass
                  traceback.print_exc();raise
              finally:
                  browser.close()
          PY

      - name: Record PASS
        if: success()
        env:
          STARTING: ${{ steps.uat.outputs.starting_unmatched }}
          MATCHED: ${{ steps.uat.outputs.matched_count }}
        run: |
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body "Finance Bank Reconciliation continuation PASS. Run \`$GITHUB_RUN_ID\`. Existing session \`REC-MSZS1YQV-7E78E\` resumed safely from \`$STARTING\` unmatched item(s); \`$MATCHED\` remaining item(s) were matched. Final status RECONCILED, statement/system closing -Rp15.000, difference Rp0, unmatched 0/4. `/finance/closing-readiness?month=2026-08` now shows bank reconciliation 1/1 complete while remaining PERLU DICEK for 1 unfinished controlled journal, 1 asset awaiting depreciation, and 1 OPEN teller shift. No period CLOSE/LOCK and no balance/journal posting were performed."

      - name: Record failure
        if: failure()
        env:
          STAGE: ${{ steps.uat.outputs.failure_stage }}
          STARTING: ${{ steps.uat.outputs.starting_unmatched }}
          MATCHED: ${{ steps.uat.outputs.matched_count }}
          URL: ${{ steps.uat.outputs.reconciliation_url }}
        run: |
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body "Finance existing reconciliation continuation did not PASS. Run \`$GITHUB_RUN_ID\`. Stage \`${STAGE:-setup}\`; starting unmatched \`${STARTING:--1}\`; matched this run \`${MATCHED:-0}\`; URL \`${URL:-none}\`. Do not create another bank reconciliation session; inspect and continue \`REC-MSZS1YQV-7E78E\` only."

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-reconciliation-continuation-${{ github.run_id }}
          path: /tmp/kdkmp-finance-continuation/*.png
          if-no-files-found: ignore
          retention-days: 14
