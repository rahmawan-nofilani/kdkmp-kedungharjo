name: Loan Penalty Waiver Resume V8

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  resume-v8:
    if: >-
      github.event.issue.number == 42 &&
      github.event.comment.body == 'UAT-KDKMP-LOAN-PENALTY-WAIVER-V8' &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 18
    env:
      UAT_BASE_URL: https://kdkmp-kedungharjo.kdkmp-kedungharjo.workers.dev
      UAT_ADMINUNIT_EMAIL: uat.adminunit@example.com
      UAT_ADMINUNIT_PASSWORD: ${{ secrets.UAT_ADMINUNIT_PASSWORD }}
      UAT_SUPERADMIN_EMAIL: uat.superadmin@example.com
      UAT_SUPERADMIN_PASSWORD: ${{ secrets.UAT_SUPERADMIN_PASSWORD }}
      APP_NO: PIN-20260819-D9AB6DEF
      CONTRACT_ID: 6203e5db-a78e-4ff7-9e0b-f459103bf20b
      CONTRACT_NO: KON-20260819-6203E5DB
      PRINCIPAL: '100000'
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Guard credentials
        run: |
          test -n "$UAT_ADMINUNIT_PASSWORD"
          test -n "$UAT_SUPERADMIN_PASSWORD"
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          python -m playwright install chromium
      - name: Resume exact contract to approved waiver
        id: uat
        shell: bash
        run: |
          mkdir -p /tmp/kdkmp-loan-penalty-v8
          python <<'PY'
          import os,re,traceback
          from playwright.sync_api import sync_playwright,expect

          BASE=os.environ['UAT_BASE_URL'].rstrip('/')
          CONTRACT_ID=os.environ['CONTRACT_ID']; CONTRACT=os.environ['CONTRACT_NO']; APP=os.environ['APP_NO']
          PRINCIPAL=int(os.environ['PRINCIPAL']); RUN=os.environ['GITHUB_RUN_ID']
          stage='setup'; disb_no=''; disb_url=''; waiver_no=''; waiver_amount=0; current_url=''

          def out(k,v):
              with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:f.write(f'{k}={str(v).replace(chr(10)," ")}\n')
          def login(browser,email,password):
              ctx=browser.new_context(); page=ctx.new_page(); page.set_default_timeout(15000)
              page.goto(BASE+'/login',wait_until='networkidle')
              page.get_by_label('Email',exact=True).fill(email)
              page.get_by_label('Kata sandi',exact=True).fill(password)
              page.get_by_role('button',name='Masuk ke KDKMP').click()
              page.wait_for_url(re.compile(r'.*/dashboard(?:\?.*)?$'),timeout=20000)
              return ctx,page
          def body(page): return re.sub(r'\s+',' ',page.locator('body').inner_text().replace('\u00a0',' '))
          def rupiah(text):
              m=re.search(r'Rp\s*([0-9.]+)',text.replace('\u00a0',' '),re.I)
              return int(re.sub(r'\D','',m.group(1))) if m else 0
          def select_containing(select,needle):
              opts=select.locator('option')
              for i in range(opts.count()):
                  o=opts.nth(i); txt=(o.inner_text() or '').strip(); value=o.get_attribute('value') or ''
                  if value and needle in txt:
                      select.select_option(value=value); return txt
              raise RuntimeError(f'Option containing {needle!r} not found')
          def choose_cash(select):
              opts=select.locator('option')
              for i in range(opts.count()):
                  o=opts.nth(i); txt=(o.inner_text() or '').strip(); value=o.get_attribute('value') or ''
                  if value and txt.startswith('CASH ·') and rupiah(txt)>=PRINCIPAL:
                      select.select_option(value=value); return txt
              raise RuntimeError('No ACTIVE CASH treasury with balance >= Rp100.000')
          def clean(page,url): page.goto(url,wait_until='networkidle')

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True); active=None
              try:
                  # Contract preflight is read-only and exact.
                  stage='contract-preflight'
                  ac,page=login(browser,os.environ['UAT_ADMINUNIT_EMAIL'],os.environ['UAT_ADMINUNIT_PASSWORD']); active=page
                  contract_url=f'{BASE}/loans/contracts/{CONTRACT_ID}'
                  clean(page,contract_url)
                  expect(page.get_by_role('heading',name=CONTRACT)).to_be_visible()
                  if 'SIAP DICAIRKAN' not in body(page) and 'READY' not in body(page):
                      raise RuntimeError('Exact contract is not READY before disbursement retry')

                  # Create one exact draft. Caller verified DB has no disbursement for this contract before trigger.
                  stage='disbursement-create'
                  page.goto(BASE+'/loans/disbursements',wait_until='networkidle')
                  page.get_by_text('+ Buat Permintaan Pencairan',exact=True).click()
                  form=page.locator('form').filter(has=page.get_by_role('button',name='Buat Draft Pencairan')).first
                  expect(form).to_be_visible()
                  select_containing(form.locator('select[name="contract_id"]'),CONTRACT)
                  form.locator('select[name="channel"]').select_option('CASH')
                  treasury=choose_cash(form.locator('select[name="treasury_account_id"]'))
                  form.locator('input[name="recipient_name"]').fill('Anggota Demo Dua')
                  form.locator('input[name="request_note"]').fill(f'Penalty waiver exact fixture {RUN}')
                  form.get_by_role('button',name='Buat Draft Pencairan').click()
                  try:
                      page.wait_for_url(re.compile(r'.*/loans/disbursements/[^?]+\?status=created$'),timeout=25000)
                  except Exception:
                      current_url=page.url
                      out('diagnostic_url',current_url)
                      out('diagnostic_body',body(page)[:500] if page.locator('body').count() else 'no-body')
                      raise
                  disb_url=page.url.split('?')[0]
                  clean(page,disb_url); disb_no=page.locator('h1').inner_text().strip()
                  if not disb_no.startswith('CAIR-'): raise RuntimeError('Disbursement number missing after create')
                  if page.get_by_role('button',name='Ajukan Pencairan').count():
                      page.get_by_role('button',name='Ajukan Pencairan').click()
                      page.wait_for_url(re.compile(r'.*\?status=submitted$'),timeout=20000)
                      clean(page,disb_url)
                  if 'SUBMITTED' not in body(page): raise RuntimeError('Disbursement is not SUBMITTED after maker action')
                  ac.close()

                  # Different SUPER_ADMIN checker + executor.
                  stage='disbursement-checker'
                  sc,page=login(browser,os.environ['UAT_SUPERADMIN_EMAIL'],os.environ['UAT_SUPERADMIN_PASSWORD']); active=page
                  clean(page,disb_url)
                  if page.get_by_role('button',name='Setujui Pencairan').count():
                      page.get_by_role('button',name='Setujui Pencairan').click()
                      page.wait_for_url(re.compile(r'.*\?status=approved$'),timeout=20000)
                      clean(page,disb_url)
                  if page.get_by_role('button',name='Eksekusi Pencairan').count():
                      page.locator('input[name="execution_reference"]').fill(f'UAT-PENALTY-{RUN}')
                      page.get_by_role('button',name='Eksekusi Pencairan').click()
                      page.wait_for_url(re.compile(r'.*\?status=disbursed$'),timeout=30000)
                      clean(page,disb_url)
                  if 'DISBURSED' not in body(page): raise RuntimeError('Disbursement did not reach DISBURSED')
                  sc.close()

                  # Current-WIB engine assesses actual overdue installments.
                  stage='penalty-assess'
                  ac,page=login(browser,os.environ['UAT_ADMINUNIT_EMAIL'],os.environ['UAT_ADMINUNIT_PASSWORD']); active=page
                  page.goto(BASE+'/loans/penalties',wait_until='networkidle')
                  crow=page.locator('tr').filter(has_text=CONTRACT).filter(has=page.get_by_role('button',name='Perbarui Denda'))
                  if crow.count():
                      crow.first.get_by_role('button',name='Perbarui Denda').click()
                      page.wait_for_url(re.compile(r'.*/loans/penalties\?status=assessed$'),timeout=25000)
                  page.goto(BASE+'/loans/penalties',wait_until='networkidle')

                  # Create or resume one waiver for this exact contract.
                  stage='waiver-maker'
                  wrow=None
                  allrows=page.locator('tr').filter(has_text=CONTRACT)
                  for i in range(allrows.count()):
                      r=allrows.nth(i); first=(r.locator('td').first.inner_text() or '').strip()
                      if first.startswith('WVR-') and re.search(r'DRAFT|SUBMITTED|APPROVED',body(r)):
                          wrow=r; break
                  if wrow is None:
                      target=None
                      for i in range(allrows.count()):
                          r=allrows.nth(i)
                          if r.locator('summary').filter(has_text='Ajukan waiver').count(): target=r; break
                      if target is None: raise RuntimeError('Positive assessed penalty with waiver action not found')
                      due=rupiah(target.locator('td').nth(6).inner_text())
                      if due<=0: raise RuntimeError('Penalty due is not positive')
                      waiver_amount=min(1000,due)
                      target.locator('summary').filter(has_text='Ajukan waiver').click()
                      target.locator('input[name="requested_amount"]').fill(str(waiver_amount))
                      target.locator('input[name="reason"]').fill('Synthetic UAT maker-checker penalty waiver certification')
                      target.get_by_role('button',name='Buat Draft Waiver').click()
                      page.wait_for_url(re.compile(r'.*/loans/penalties\?status=waiver-created.*'),timeout=20000)
                      page.goto(BASE+'/loans/penalties',wait_until='networkidle')
                      candidates=page.locator('tr').filter(has_text=CONTRACT).filter(has_text='DRAFT')
                      for i in range(candidates.count()):
                          r=candidates.nth(i)
                          if (r.locator('td').first.inner_text() or '').strip().startswith('WVR-'): wrow=r; break
                      if wrow is None: raise RuntimeError('Created waiver row not found after clean reload')
                  waiver_no=(wrow.locator('td').first.inner_text() or '').strip().split()[0]
                  if waiver_amount<=0: waiver_amount=rupiah(wrow.locator('td').nth(2).inner_text())
                  if wrow.get_by_text('DRAFT',exact=True).count() and wrow.get_by_role('button',name='Ajukan').count():
                      wrow.get_by_role('button',name='Ajukan').click()
                      page.wait_for_url(re.compile(r'.*/loans/penalties\?status=submitted.*'),timeout=20000)
                  ac.close()

                  stage='waiver-checker'
                  sc,page=login(browser,os.environ['UAT_SUPERADMIN_EMAIL'],os.environ['UAT_SUPERADMIN_PASSWORD']); active=page
                  page.goto(BASE+'/loans/penalties',wait_until='networkidle')
                  wrow=page.locator('tr').filter(has_text=waiver_no).first; expect(wrow).to_be_visible()
                  if wrow.get_by_text('SUBMITTED',exact=True).count():
                      note=wrow.locator('input[name="decision_note"]').first
                      if note.count(): note.fill('Approved for synthetic UAT certification')
                      wrow.get_by_role('button',name='Setujui').click()
                      page.wait_for_url(re.compile(r'.*/loans/penalties\?status=approved$'),timeout=20000)
                      page.goto(BASE+'/loans/penalties',wait_until='networkidle')
                      wrow=page.locator('tr').filter(has_text=waiver_no).first
                  expect(wrow.get_by_text('APPROVED',exact=True)).to_be_visible(timeout=15000)
                  page.screenshot(path='/tmp/kdkmp-loan-penalty-v8/pass.png',full_page=True)
                  sc.close()

                  out('failure_stage',''); out('application_number',APP); out('contract_number',CONTRACT); out('disbursement_number',disb_no); out('waiver_number',waiver_no); out('waiver_amount',waiver_amount); out('treasury',treasury)
                  print('Loan penalty waiver V8 PASS')
              except Exception:
                  out('failure_stage',stage); out('application_number',APP); out('contract_number',CONTRACT); out('disbursement_number',disb_no); out('waiver_number',waiver_no); out('waiver_amount',waiver_amount); out('current_url',getattr(active,'url',''))
                  if active:
                      try: active.screenshot(path='/tmp/kdkmp-loan-penalty-v8/failure.png',full_page=True)
                      except Exception: pass
                  traceback.print_exc(); raise
              finally: browser.close()
          PY
      - name: Record PASS
        if: success()
        env:
          APP: ${{ steps.uat.outputs.application_number }}
          CONTRACT: ${{ steps.uat.outputs.contract_number }}
          DISB: ${{ steps.uat.outputs.disbursement_number }}
          WAIVER: ${{ steps.uat.outputs.waiver_number }}
          AMOUNT: ${{ steps.uat.outputs.waiver_amount }}
        run: |
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body "Loan non-zero penalty + waiver maker-checker UAT PASS. Exact-contract resume run \`$GITHUB_RUN_ID\`: existing product/application reused, F001 untouched; \`$APP\` APPROVED; historical WEEKLY contract \`$CONTRACT\` → CASH disbursement \`$DISB\`; current-WIB assessment produced positive overdue penalty; ADMIN_UNIT submitted waiver \`$WAIVER\` Rp$AMOUNT and different SUPER_ADMIN approved it. No direct schedule/status SQL manipulation."
      - name: Record failure
        if: failure()
        env:
          STAGE: ${{ steps.uat.outputs.failure_stage }}
          APP: ${{ steps.uat.outputs.application_number }}
          CONTRACT: ${{ steps.uat.outputs.contract_number }}
          DISB: ${{ steps.uat.outputs.disbursement_number }}
          WAIVER: ${{ steps.uat.outputs.waiver_number }}
          URL: ${{ steps.uat.outputs.current_url }}
          DURL: ${{ steps.uat.outputs.diagnostic_url }}
          DBODY: ${{ steps.uat.outputs.diagnostic_body }}
        run: |
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body "Loan penalty/waiver V8 did not PASS. Run \`$GITHUB_RUN_ID\`; stage \`${STAGE:-setup}\`; app \`${APP:-none}\`; contract \`${CONTRACT:-none}\`; disbursement \`${DISB:-none}\`; waiver \`${WAIVER:-none}\`; URL \`${URL:-none}\`; create diagnostic \`${DURL:-none}\` / \`${DBODY:-none}\`. Resume exact fixture only."
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loan-penalty-waiver-v8-${{ github.run_id }}
          path: /tmp/kdkmp-loan-penalty-v8/*.png
          if-no-files-found: ignore
          retention-days: 14
