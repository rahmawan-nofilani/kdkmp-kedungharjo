name: Finance Reconciliation Closing UAT

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  finance-reconciliation-closing-uat:
    if: >-
      github.event.issue.number == 42 &&
      github.event.comment.body == 'UAT-KDKMP-FINANCE-RECON-CLOSING' &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    env:
      UAT_BASE_URL: https://kdkmp-kedungharjo.kdkmp-kedungharjo.workers.dev
      UAT_SUPERADMIN_EMAIL: uat.superadmin@example.com
      UAT_SUPERADMIN_PASSWORD: ${{ secrets.UAT_SUPERADMIN_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Guard credential
        run: test -n "$UAT_SUPERADMIN_PASSWORD"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          python -m playwright install chromium

      - name: Execute bank reconciliation and closing-readiness UAT
        id: uat
        shell: bash
        run: |
          mkdir -p /tmp/kdkmp-finance
          python <<'PY'
          import os,re,traceback
          from playwright.sync_api import sync_playwright,expect

          BASE=os.environ['UAT_BASE_URL'].rstrip('/')
          stage='login'; recon_no=''; matched_count=0; recon_url=''

          def out(k,v):
              with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
                  f.write(f'{k}={str(v).replace(chr(10)," ")}\n')

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(); page.set_default_timeout(15000)
              try:
                  page.goto(BASE+'/login',wait_until='networkidle')
                  page.get_by_label('Email',exact=True).fill(os.environ['UAT_SUPERADMIN_EMAIL'])
                  page.get_by_label('Kata sandi',exact=True).fill(os.environ['UAT_SUPERADMIN_PASSWORD'])
                  page.get_by_role('button',name='Masuk ke KDKMP').click()
                  page.wait_for_url(re.compile(r'.*/dashboard(?:\?.*)?$'),timeout=20000)

                  stage='create-reconciliation'
                  page.goto(BASE+'/finance/treasury',wait_until='networkidle')
                  form=page.locator('form').filter(has=page.get_by_role('button',name='Buat Rekonsiliasi')).first
                  expect(form).to_be_visible()
                  bank=form.locator('select[name="treasuryAccountId"]')
                  opts=bank.locator('option')
                  chosen=None
                  for i in range(opts.count()):
                      opt=opts.nth(i); text=(opt.inner_text() or '').strip(); value=opt.get_attribute('value') or ''
                      if value and 'BANK_MAIN' in text:
                          chosen=value; break
                  if not chosen: raise RuntimeError('BANK_MAIN is not available for reconciliation')
                  bank.select_option(value=chosen)
                  form.locator('input[name="statementClosingBalance"]').fill('-15000')
                  form.locator('input[name="periodStart"]').fill('2026-08-01')
                  form.locator('input[name="periodEnd"]').fill('2026-08-19')
                  form.locator('input[name="notes"]').fill('UAT Finance reconciliation 2026-08; statement equals verified D1 ledger')
                  form.get_by_role('button',name='Buat Rekonsiliasi').click()
                  page.wait_for_url(re.compile(r'.*/finance/treasury/reconciliation/[^?]+\?status=created$'),timeout=25000)
                  recon_url=page.url.split('?')[0]
                  recon_no=page.locator('h1').inner_text().strip()
                  if not recon_no: raise RuntimeError('Reconciliation number empty')
                  expect(page.get_by_text('DRAFT',exact=True).first).to_be_visible()
                  body=re.sub(r'\s+',' ',page.locator('body').inner_text().replace('\u00a0',' '))
                  if not re.search(r'Difference\s*-?Rp\s*0',body):
                      # Intl IDR may render -Rp15.000 / Rp0 variants; difference itself must be zero.
                      if 'Difference' not in body or not re.search(r'Difference\s*Rp\s*0',body):
                          raise RuntimeError(f'Reconciliation difference is not zero: {body[:900]}')

                  stage='match-items'
                  while True:
                      match_buttons=page.get_by_role('button',name='Match',exact=True)
                      count=match_buttons.count()
                      if count==0: break
                      match_buttons.first.click()
                      page.wait_for_url(re.compile(r'.*\?status=item-updated$'),timeout=20000)
                      matched_count+=1
                      if matched_count>100: raise RuntimeError('Unexpected reconciliation item loop >100')
                  expect(page.get_by_text('Ready to reconcile',exact=True)).to_be_visible()
                  normalized=re.sub(r'\s+',' ',page.locator('body').inner_text().replace('\u00a0',' '))
                  if not re.search(r'Unmatched\s*0',normalized): raise RuntimeError('Unmatched count is not zero')

                  stage='complete-reconciliation'
                  page.get_by_role('button',name='Complete Reconciliation').click()
                  page.wait_for_url(re.compile(r'.*\?status=reconciled$'),timeout=20000)
                  expect(page.get_by_text('RECONCILED',exact=True).first).to_be_visible()
                  expect(page.get_by_text('Rekonsiliasi selesai',exact=True)).to_be_visible()
                  page.screenshot(path='/tmp/kdkmp-finance/reconciliation-pass.png',full_page=True)

                  stage='closing-readiness'
                  page.goto(BASE+'/finance/closing-readiness?month=2026-08',wait_until='networkidle')
                  expect(page.get_by_role('heading',name='Kesiapan Tutup Buku')).to_be_visible()
                  expect(page.get_by_text('PERLU DICEK',exact=True)).to_be_visible()
                  text=re.sub(r'\s+',' ',page.locator('body').inner_text().replace('\u00a0',' '))
                  required=[
                      'Tidak ada shift teller yang masih OPEN',
                      'Jurnal manual tidak memiliki DRAFT/SUBMITTED',
                      'Penyusutan aset bulan berjalan sudah POSTED',
                  ]
                  for label in required:
                      if label not in text: raise RuntimeError(f'Closing-readiness blocker missing: {label}')
                  if 'rekonsiliasi bank' not in text.lower(): raise RuntimeError('Bank reconciliation readiness check not visible')
                  page.screenshot(path='/tmp/kdkmp-finance/closing-readiness-pass.png',full_page=True)
                  out('failure_stage','');out('reconciliation_number',recon_no);out('matched_count',matched_count);out('reconciliation_url',recon_url)
                  print('Finance reconciliation + closing readiness UAT PASS')
              except Exception:
                  out('failure_stage',stage);out('reconciliation_number',recon_no);out('matched_count',matched_count);out('reconciliation_url',recon_url)
                  try: page.screenshot(path='/tmp/kdkmp-finance/failure.png',full_page=True)
                  except Exception: pass
                  traceback.print_exc();raise
              finally: browser.close()
          PY

      - name: Record PASS
        if: success()
        env:
          RECON: ${{ steps.uat.outputs.reconciliation_number }}
          MATCHED: ${{ steps.uat.outputs.matched_count }}
        run: |
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body "Finance Bank Reconciliation + Closing Readiness UAT PASS. Run \`$GITHUB_RUN_ID\`. BANK_MAIN statement/ledger closing balance -Rp15.000 was reconciled in session \`$RECON\`; \`$MATCHED\` bank journal-line item(s) were matched; final reconciliation status RECONCILED with difference Rp0/unmatched 0. Read-only `/finance/closing-readiness?month=2026-08` correctly remains PERLU DICEK and surfaces the intentional blockers: OPEN teller shift, unfinished controlled journal, and missing depreciation posting. No accounting period CLOSE/LOCK and no balance/journal mutation were performed by this UAT."

      - name: Record failure
        if: failure()
        env:
          STAGE: ${{ steps.uat.outputs.failure_stage }}
          RECON: ${{ steps.uat.outputs.reconciliation_number }}
          MATCHED: ${{ steps.uat.outputs.matched_count }}
        run: |
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body "Finance Bank Reconciliation / Closing Readiness UAT did not PASS. Run \`$GITHUB_RUN_ID\`. Stage \`${STAGE:-setup}\`; reconciliation \`${RECON:-not-created}\`; matched items \`${MATCHED:-0}\`. Inspect current reconciliation state before retry; do not create a second overlapping session until this one is understood."

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-reconciliation-closing-${{ github.run_id }}
          path: /tmp/kdkmp-finance/*.png
          if-no-files-found: ignore
          retention-days: 14
