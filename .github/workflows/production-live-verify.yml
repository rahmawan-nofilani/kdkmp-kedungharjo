name: Production Live Verification

on:
  workflow_run:
    workflows: ["Cloudflare Production Deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type VERIFY-KDKMP-PRODUCTION to verify the live site
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  live-verify:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.confirmation == 'VERIFY-KDKMP-PRODUCTION')
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      WORKER_NAME: kdkmp-kedungharjo
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve Cloudflare account and production URL
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_D1_DATABASE_ID" ]; then
            echo "Cloudflare API token and D1 database ID are required for live verification." >&2
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const databaseId = process.env.CLOUDFLARE_D1_DATABASE_ID;
          const explicitAccountId = process.env.CLOUDFLARE_ACCOUNT_ID?.trim();
          const headers = { Authorization: `Bearer ${token}` };

          async function cloudflare(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, { headers });
            let body;
            try { body = await response.json(); } catch { body = null; }
            return { response, body };
          }

          async function ownsD1(accountId) {
            const { response, body } = await cloudflare(`/accounts/${accountId}/d1/database/${databaseId}`);
            return response.ok && body?.success && body.result?.uuid === databaseId;
          }

          async function resolveAccountId() {
            if (explicitAccountId) {
              if (!(await ownsD1(explicitAccountId))) throw new Error('Optional CLOUDFLARE_ACCOUNT_ID does not own the supplied D1 database ID.');
              return explicitAccountId;
            }
            const accounts = [];
            let page = 1;
            while (true) {
              const { response, body } = await cloudflare(`/accounts?page=${page}&per_page=50`);
              if (!response.ok || !body?.success || !Array.isArray(body.result)) {
                throw new Error('Could not list Cloudflare accounts. Add optional CLOUDFLARE_ACCOUNT_ID if the token cannot list accounts.');
              }
              accounts.push(...body.result);
              const totalPages = Math.max(1, Math.ceil((body.result_info?.total_count ?? accounts.length) / 50));
              if (page >= totalPages) break;
              page += 1;
            }
            const matches = [];
            for (const account of accounts) if (await ownsD1(account.id)) matches.push(account.id);
            if (matches.length !== 1) throw new Error(`Expected exactly one accessible account to own the supplied D1 database ID; found ${matches.length}.`);
            return matches[0];
          }

          (async () => {
            const accountId = await resolveAccountId();
            const { response, body } = await cloudflare(`/accounts/${accountId}/workers/subdomain`);
            if (!response.ok || !body?.success || !body.result?.subdomain) throw new Error('Could not resolve Cloudflare Workers subdomain.');
            const url = `https://${process.env.WORKER_NAME}.${body.result.subdomain}.workers.dev`;
            fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ACCOUNT_ID=${accountId}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_PRODUCTION_URL=${url}\n`);
            console.log(`Resolved production URL: ${url}`);
          })().catch((error) => {
            console.error(error.message || error);
            process.exit(1);
          });
          NODE

      - name: Verify Worker exposure
        shell: bash
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/subdomain" \
            -o /tmp/worker-subdomain-status.json
          node - <<'NODE'
          const fs = require('fs');
          const value = JSON.parse(fs.readFileSync('/tmp/worker-subdomain-status.json', 'utf8'));
          if (!value.success || value.result?.enabled !== true) {
            console.error('Worker workers.dev exposure is not enabled.');
            process.exit(1);
          }
          NODE

      - name: Verify infrastructure health
        shell: bash
        run: |
          base="${CLOUDFLARE_PRODUCTION_URL%/}"
          curl --fail --show-error --silent --location --retry 5 --retry-delay 3 --max-time 30 "$base/api/health" -o /tmp/health.json
          node - <<'NODE'
          const fs = require('fs');
          const value = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          if (value.status !== 'ok' || value.checks?.d1 !== 'ok' || value.checks?.supabase !== 'ok') {
            console.error('Production health gate failed:', value);
            process.exit(1);
          }
          console.log('D1 + Supabase health PASS');
          NODE

      - name: Verify public release surface
        shell: bash
        run: |
          base="${CLOUDFLARE_PRODUCTION_URL%/}"
          curl --fail --show-error --silent --location --retry 3 --max-time 30 "$base/" -o /tmp/home.html
          curl --fail --show-error --silent --location --retry 3 --max-time 30 "$base/login" -o /tmp/login.html
          curl --fail --show-error --silent --location --retry 3 --max-time 30 "$base/manifest.webmanifest" -o /tmp/manifest.json

          if grep -Eqi 'PHASE[[:space:]]*0|AKSES[[:space:]]+DEVELOPMENT|Masuk ke Development' /tmp/home.html /tmp/login.html; then
            echo "Stale development copy detected on production surface." >&2
            exit 1
          fi

          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('/tmp/manifest.json', 'utf8'));
          if (manifest.display !== 'standalone') throw new Error('PWA manifest display must be standalone');
          if (manifest.start_url !== '/dashboard') throw new Error('PWA manifest start_url must be /dashboard');
          if (!Array.isArray(manifest.icons) || manifest.icons.length < 1) throw new Error('PWA manifest icon missing');
          console.log('Public release surface + PWA manifest PASS');
          NODE

      - name: Record verification in go-live issue
        if: success()
        shell: bash
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body "Automated production live verification PASS for \`$sha\` at ${CLOUDFLARE_PRODUCTION_URL}: workers.dev exposure, D1+Supabase health, public root/login, stale-development-copy guard, and PWA manifest checks all passed. Authenticated synthetic-data UAT + backup/restore evidence are still required before real-data go-live."

      - name: Verification summary
        if: success()
        shell: bash
        run: |
          {
            echo "## KDKMP live verification"
            echo "- URL: ${CLOUDFLARE_PRODUCTION_URL}"
            echo "- Worker exposure: PASS"
            echo "- D1 + Supabase health: PASS"
            echo "- Public root/login: PASS"
            echo "- Stale development copy: NONE"
            echo "- PWA manifest: PASS"
            echo ""
            echo "Remaining manual gate: authenticated synthetic-data UAT, readiness PASS, and backup/restore evidence."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: rm -f /tmp/health.json /tmp/home.html /tmp/login.html /tmp/manifest.json /tmp/worker-subdomain-status.json
