name: Loan Product Maker Secret Check

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  check:
    if: >-
      github.event.issue.number == 42 &&
      github.event.comment.body == 'CHECK-KDKMP-LOAN-PRODUCT-MAKER' &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    environment: production
    env:
      MANAGER_PASSWORD: ${{ secrets.UAT_MANAGER_PASSWORD }}
      PENGURUS_PASSWORD: ${{ secrets.UAT_PENGURUS_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report availability only
        shell: bash
        run: |
          manager=no; pengurus=no
          test -n "$MANAGER_PASSWORD" && manager=yes || true
          test -n "$PENGURUS_PASSWORD" && pengurus=yes || true
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body "Loan product maker credential availability: UAT_MANAGER_PASSWORD=$manager; UAT_PENGURUS_PASSWORD=$pengurus. Values were not printed."
