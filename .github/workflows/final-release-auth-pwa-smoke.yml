name: Final Release Auth PWA Smoke

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  final-release-smoke:
    if: >-
      github.event.issue.number == 42 &&
      github.event.comment.body == 'SMOKE-KDKMP-FINAL-RELEASE' &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 12
    env:
      UAT_BASE_URL: https://kdkmp-kedungharjo.kdkmp-kedungharjo.workers.dev
      UAT_SUPERADMIN_EMAIL: uat.superadmin@example.com
      UAT_SUPERADMIN_PASSWORD: ${{ secrets.UAT_SUPERADMIN_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Guard credential
        run: test -n "$UAT_SUPERADMIN_PASSWORD"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          python -m playwright install chromium

      - name: Verify PWA, v1.3 mobile navigation, authenticated routes, and logout
        id: smoke
        shell: bash
        run: |
          mkdir -p /tmp/kdkmp-final-smoke
          python <<'PY'
          import json,os,re,traceback
          from playwright.sync_api import sync_playwright,expect

          BASE=os.environ['UAT_BASE_URL'].rstrip('/')
          stage='public'; route=''; install_errors=[]
          routes=[
            '/dashboard','/simpan-pinjam',
            '/savings/accounts?intent=deposit','/savings/accounts?intent=withdraw',
            '/pos','/teller','/members','/inventory','/procurement',
            '/finance','/finance/treasury','/finance/journals','/finance/assets','/finance/closing-readiness',
            '/loans/applications','/loans/contracts','/loans/repayments',
            '/approvals','/reports/daily-sales','/readiness'
          ]

          def out(k,v):
              with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
                  f.write(f'{k}={str(v).replace(chr(10)," ")}\n')

          def normalized(page):
              return re.sub(r'\s+',' ',page.locator('body').inner_text().replace('\u00a0',' '))

          def assert_healthy(page,path):
              text=normalized(page)
              bad=['This page couldn’t load','Application error','Internal Server Error','Runtime Error']
              for marker in bad:
                  if marker.lower() in text.lower(): raise RuntimeError(f'{path}: runtime error marker {marker}')
              if page.url.startswith(BASE+'/login') and path!='/login': raise RuntimeError(f'{path}: unexpectedly redirected to login')
              if not text.strip(): raise RuntimeError(f'{path}: empty page body')
              overflow=page.evaluate('''() => ({
                vw: window.innerWidth,
                doc: document.documentElement.scrollWidth,
                body: document.body.scrollWidth
              })''')
              if max(overflow['doc'],overflow['body']) > overflow['vw'] + 4:
                  raise RuntimeError(f"{path}: root horizontal overflow {overflow} (internal table scrollers are allowed; page-level overflow is not)")

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              ctx=browser.new_context(viewport={'width':390,'height':844},device_scale_factor=2,is_mobile=True,has_touch=True)
              page=ctx.new_page(); page.set_default_timeout(15000)
              try:
                  stage='public-pwa'
                  page.goto(BASE+'/',wait_until='networkidle')
                  response=page.request.get(BASE+'/manifest.webmanifest')
                  if not response.ok: raise RuntimeError(f'manifest HTTP {response.status}')
                  manifest=response.json()
                  if manifest.get('display')!='standalone': raise RuntimeError('manifest display is not standalone')
                  if manifest.get('start_url')!='/dashboard': raise RuntimeError('manifest start_url is not /dashboard')
                  icons=manifest.get('icons') or []
                  if not icons: raise RuntimeError('manifest has no icons')
                  for icon in icons:
                      src=icon.get('src')
                      if src:
                          r=page.request.get(BASE+src if src.startswith('/') else src)
                          if not r.ok: raise RuntimeError(f'PWA icon unavailable: {src} HTTP {r.status}')

                  cdp=ctx.new_cdp_session(page)
                  app_manifest=cdp.send('Page.getAppManifest')
                  if app_manifest.get('errors'):
                      raise RuntimeError('Chromium manifest parse errors: '+json.dumps(app_manifest.get('errors'),ensure_ascii=False))
                  try:
                      raw=cdp.send('Page.getInstallabilityErrors')
                      install_errors=raw.get('installabilityErrors') or []
                  except Exception:
                      install_errors=[]

                  stage='login'
                  page.goto(BASE+'/login',wait_until='networkidle')
                  email=page.locator('input[type="email"]').first
                  password=page.locator('input[type="password"]').first
                  expect(email).to_be_visible(); expect(password).to_be_visible()
                  email.fill(os.environ['UAT_SUPERADMIN_EMAIL'])
                  password.fill(os.environ['UAT_SUPERADMIN_PASSWORD'])
                  page.get_by_role('button',name='Masuk ke KopdesKu',exact=True).click()
                  page.wait_for_url(re.compile(r'.*/dashboard(?:\?.*)?$'),timeout=20000)
                  assert_healthy(page,'/dashboard')

                  stage='mobile-bottom-nav'
                  for label in ['Beranda','Transaksi','Simpan Pinjam','Laporan','Menu']:
                      control=page.get_by_text(label,exact=True).last
                      expect(control).to_be_visible()

                  stage='transaction-launcher'
                  page.get_by_role('button',name='Transaksi',exact=True).click()
                  dialog=page.get_by_role('dialog',name='Pilih Transaksi')
                  expect(dialog).to_be_visible()
                  expect(dialog.get_by_text('POS / Penjualan',exact=True)).to_be_visible()
                  dialog.get_by_role('button',name='Tutup').click()

                  stage='domain-menu'
                  page.get_by_role('button',name='Menu',exact=True).click()
                  menu=page.get_by_role('dialog',name='Menu KopdesKu')
                  expect(menu).to_be_visible()
                  summary=menu.locator('summary').filter(has_text='Simpan Pinjam').first
                  expect(summary).to_be_visible(); summary.click()
                  expect(menu.get_by_text('Beranda Simpan Pinjam',exact=True)).to_be_visible()
                  expect(menu.get_by_text('Setoran Masuk',exact=True)).to_be_visible()
                  menu.get_by_role('button',name='Tutup').click()

                  stage='authenticated-routes'
                  for route in routes:
                      page.goto(BASE+route,wait_until='networkidle')
                      assert_healthy(page,route)

                  stage='pos-mobile-switcher'
                  page.goto(BASE+'/pos',wait_until='networkidle')
                  assert_healthy(page,'/pos')
                  products=page.get_by_role('button',name='Produk',exact=True)
                  cart=page.get_by_role('button',name=re.compile(r'^Keranjang'))
                  expect(products).to_be_visible(); expect(cart).to_be_visible()
                  cart.click(); expect(page.get_by_text('Transaksi baru',exact=True)).to_be_visible()
                  products.click(); expect(page.get_by_text('Pilih barang',exact=True)).to_be_visible()

                  page.goto(BASE+'/dashboard',wait_until='networkidle')
                  page.screenshot(path='/tmp/kdkmp-final-smoke/dashboard-mobile.png',full_page=True)
                  page.goto(BASE+'/simpan-pinjam',wait_until='networkidle')
                  page.screenshot(path='/tmp/kdkmp-final-smoke/simpan-pinjam-mobile.png',full_page=True)
                  page.goto(BASE+'/pos',wait_until='networkidle')
                  page.screenshot(path='/tmp/kdkmp-final-smoke/pos-mobile.png',full_page=True)

                  stage='logout'
                  page.goto(BASE+'/dashboard',wait_until='networkidle')
                  page.get_by_role('button',name='Menu',exact=True).click()
                  menu=page.get_by_role('dialog',name='Menu KopdesKu')
                  expect(menu).to_be_visible()
                  button=menu.get_by_role('button',name='Keluar',exact=True)
                  expect(button).to_be_visible(); button.click()
                  page.wait_for_url(re.compile(r'.*/login(?:\?.*)?$'),timeout=20000)
                  expect(page.locator('input[type="email"]').first).to_be_visible()
                  page.goto(BASE+'/dashboard',wait_until='networkidle')
                  if not page.url.startswith(BASE+'/login'):
                      raise RuntimeError('Protected dashboard remained accessible after logout')

                  out('failure_stage',''); out('failure_route',''); out('installability_errors',json.dumps(install_errors,ensure_ascii=False))
                  print('Final authenticated release smoke PASS')
              except Exception:
                  out('failure_stage',stage); out('failure_route',route); out('installability_errors',json.dumps(install_errors,ensure_ascii=False))
                  try: page.screenshot(path='/tmp/kdkmp-final-smoke/failure.png',full_page=True)
                  except Exception: pass
                  traceback.print_exc(); raise
              finally:
                  browser.close()
          PY

      - name: Record PASS
        if: success()
        env:
          INSTALL_ERRORS: ${{ steps.smoke.outputs.installability_errors }}
        run: |
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body "Final authenticated/PWA mobile smoke PASS. Run \`$GITHUB_RUN_ID\`: production HTTPS manifest/start_url/standalone/icons loaded; Chromium manifest diagnostics had no parse errors; SUPER_ADMIN login passed; 390x844 mobile bottom navigation, Transaksi launcher, domain-first Menu, Simpan Pinjam hierarchy, POS Produk↔Keranjang switcher, all certified routes, page-level horizontal-overflow guard, and Menu → Keluar session protection passed. Chromium installability diagnostics: \`${INSTALL_ERRORS:-[]}\`. Physical OS/browser install-button interaction remains device UI and is not fabricated by this headless check."

      - name: Record failure
        if: failure()
        env:
          STAGE: ${{ steps.smoke.outputs.failure_stage }}
          ROUTE: ${{ steps.smoke.outputs.failure_route }}
          INSTALL_ERRORS: ${{ steps.smoke.outputs.installability_errors }}
        run: |
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body "Final authenticated/PWA mobile smoke did not PASS. Run \`$GITHUB_RUN_ID\`; stage \`${STAGE:-setup}\`; route \`${ROUTE:-none}\`; Chromium installability diagnostics \`${INSTALL_ERRORS:-[]}\`. Inspect v1.3 responsive/release gate before sign-off."

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-release-auth-pwa-${{ github.run_id }}
          path: /tmp/kdkmp-final-smoke/*.png
          if-no-files-found: ignore
          retention-days: 14
